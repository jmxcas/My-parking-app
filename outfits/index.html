<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Worn">
  <meta name="theme-color" content="#000000">
  <title>Worn</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- ── TODAY TAB ─────────────────────────────────────────── -->
  <section class="tab active" id="tab-today">
    <header class="header">
      <span class="header-title">Worn</span>
    </header>
    <div class="tab-body" id="today-body"></div>
  </section>

  <!-- ── CALENDAR TAB ──────────────────────────────────────── -->
  <section class="tab" id="tab-calendar">
    <header class="header">
      <div class="header-left">
        <button class="icon-btn" id="cal-prev" aria-label="Previous month">
          <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
      </div>
      <span class="header-title" id="cal-title"></span>
      <div class="header-right">
        <button class="icon-btn" id="cal-next" aria-label="Next month">
          <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
    </header>
    <div class="tab-body">
      <div class="cal-weekdays" id="cal-weekdays"></div>
      <div class="cal-grid" id="cal-grid"></div>
      <button class="link-btn" id="cal-today">Jump to today</button>
    </div>
  </section>

  <!-- ── CLOSET TAB ────────────────────────────────────────── -->
  <section class="tab" id="tab-closet">
    <header class="header">
      <span class="header-title">Closet</span>
    </header>
    <div class="tab-body">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="search" id="closet-search" placeholder="When did I last wear…" autocomplete="off">
      </div>
      <div class="seg" id="closet-sort">
        <button class="seg-btn active" data-sort="recent">Recently worn</button>
        <button class="seg-btn" data-sort="oldest">Not worn lately</button>
        <button class="seg-btn" data-sort="most">Most worn</button>
      </div>
      <div id="closet-list"></div>

      <div class="section-label">Backup</div>
      <div class="group">
        <button class="group-row" id="btn-export">Export backup<span class="chev">›</span></button>
        <button class="group-row" id="btn-import">Import backup<span class="chev">›</span></button>
      </div>
      <p class="footnote">Everything is stored only on this device. Export a backup now and then so you don't lose your history.</p>
    </div>
  </section>

  <!-- ── TAB BAR ───────────────────────────────────────────── -->
  <nav class="tabbar">
    <button class="tabbar-btn active" data-tab="today">
      <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/></svg>
      <span>Today</span>
    </button>
    <button class="tabbar-btn" data-tab="calendar">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg>
      <span>Calendar</span>
    </button>
    <button class="tabbar-add" id="btn-add" aria-label="Log outfit">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <button class="tabbar-btn" data-tab="closet">
      <svg viewBox="0 0 24 24"><path d="M12 5a2 2 0 1 1 2 2c-1 0-2 .6-2 1.5V9"/><path d="M12 9 3 15.5c-.8.6-.4 1.5.5 1.5h17c.9 0 1.3-.9.5-1.5Z"/></svg>
      <span>Closet</span>
    </button>
  </nav>

  <!-- ── LOG / EDIT SCREEN ─────────────────────────────────── -->
  <section class="screen" id="screen-log">
    <header class="header">
      <div class="header-left">
        <button class="text-btn" id="log-cancel">Cancel</button>
      </div>
      <span class="header-title" id="log-title">Log Outfit</span>
      <div class="header-right">
        <button class="text-btn bold" id="log-save">Save</button>
      </div>
    </header>
    <div class="screen-body">
      <div class="group">
        <label class="group-row">
          <span>Date</span>
          <input type="date" id="log-date" class="date-input">
        </label>
      </div>

      <div class="photo-slot" id="log-photo">
        <div class="photo-empty">
          <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          <span>Add a mirror selfie</span>
          <small>optional, but makes it easy to remember</small>
        </div>
        <img alt="Outfit photo" class="hidden">
        <button class="photo-remove hidden" id="log-photo-remove" aria-label="Remove photo">
          <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <div class="section-label">What you wore</div>
      <div class="group" id="log-items"></div>
      <p class="footnote">Separate multiple things with commas. Past items autocomplete.</p>

      <div class="section-label">Occasion</div>
      <div class="chips" id="log-occasions"></div>

      <div class="section-label">Notes</div>
      <div class="group">
        <textarea id="log-note" rows="3" placeholder="Where you went, who you saw, how it felt…"></textarea>
      </div>

      <button class="btn-danger hidden" id="log-delete">Delete Outfit</button>
    </div>
  </section>

  <!-- ── DAY DETAIL SCREEN ─────────────────────────────────── -->
  <section class="screen" id="screen-day">
    <header class="header">
      <div class="header-left">
        <button class="back-btn" data-back>
          <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
          Back
        </button>
      </div>
      <span class="header-title" id="day-title"></span>
    </header>
    <div class="screen-body" id="day-body"></div>
  </section>

  <!-- ── ITEM DETAIL SCREEN ────────────────────────────────── -->
  <section class="screen" id="screen-item">
    <header class="header">
      <div class="header-left">
        <button class="back-btn" data-back>
          <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
          Back
        </button>
      </div>
      <span class="header-title" id="item-title"></span>
    </header>
    <div class="screen-body" id="item-body"></div>
  </section>

</div>

<!-- Photo viewer -->
<div id="photo-viewer" class="photo-viewer">
  <img id="photo-viewer-img" src="" alt="Outfit photo">
</div>

<!-- Toast -->
<div id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
